name: Java CI

on:
  push:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17.\gradlew.bat clean test'
          distribution: 'temurin'

      - name: Build and test with Maven
        run: mvn clean test